[project]
name = "babyagi"
version = "0.1.2"
description = "An experimental prototype framework for building self building autonomous agents."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Yohei Nakajima", email = "babyagi@untapped.vc"},
]
keywords = ["AGI", "AI", "Framework", "Baby AGI"]
requires-python = ">=3.11"
dependencies = [
    "Flask>=2.0.0",
    "sqlalchemy>=1.4,<2.0",
    "cryptography",
    "scikit-learn",
    "litellm",
    "openai",
    "python-dotenv>=1.2.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Author = "https://x.com/yoheinakajima"
Repository = "https://github.com/yoheinakajima/babyagi"

[project.scripts]
babyagi = "babyagi.main:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["babyagi*"]

[tool.pyright]
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
select = ["E", "W", "F", "I", "B", "C4", "ARG", "SIM"]
ignore = ["W291", "W292", "W293"]
